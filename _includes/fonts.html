<!-- Font Awesome icons (local, load asynchronously due to size) -->
<link
  href="{{ '/css/vendor/fontawesome/all.css' | relative_url }}"
  rel="preload"
  as="style"
  onload="this.onload = null; this.rel = 'stylesheet';"
/>
<noscript>
  <link
    href="{{ '/css/vendor/fontawesome/all.css' | relative_url }}"
    rel="stylesheet"
  />
</noscript>
